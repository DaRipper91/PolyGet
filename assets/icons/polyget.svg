<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b2e"/>
      <stop offset="1" stop-color="#0d0714"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#2e1a47" stroke-width="3"/>

  <!-- Package box (isometric) -->
  <g>
    <!-- box top face -->
    <polygon points="64,30 100,48 64,66 28,48" fill="#a78bfa" opacity="0.95"/>
    <!-- box left face -->
    <polygon points="28,48 64,66 64,104 28,86" fill="#7c3aed"/>
    <!-- box right face -->
    <polygon points="100,48 64,66 64,104 100,86" fill="#6d28d9"/>
    <!-- box edge highlight -->
    <polyline points="28,48 64,66 100,48" fill="none" stroke="#e9d5ff" stroke-width="2.5"
              stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="64,66 64,104" fill="none" stroke="#4c1d95" stroke-width="2"
              stroke-linecap="round"/>
  </g>

  <!-- Upgrade arrow rising out of the box -->
  <g>
    <rect x="58.5" y="22" width="11" height="26" rx="5.5" fill="url(#arrow)"/>
    <polygon points="64,8 79,26 49,26" fill="url(#arrow)"/>
  </g>
</svg>
