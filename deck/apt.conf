// apt.conf — Mobile performance, storage preservation, and Zero-Trust safety for da-pixel-10-pro
// Generated and managed by pixel-deck / configure-apt.sh.
// Place in /data/data/com.termux/files/usr/etc/apt/apt.conf.d/99pixel-deck or /etc/apt/apt.conf.d/99pixel-deck

// --- Safety & Integrity ---
Acquire::AllowInsecureRepositories "false";
Acquire::Check-Valid-Until "true";

// --- Speed & Mobile Latency ---
Acquire::Languages "none";
Acquire::http::Pipeline-Depth "5";
Acquire::http::Timeout "20";
Acquire::Retries "3";

// --- Memory & Flash Storage Preservation ---
APT::Install-Recommends "false";
APT::Install-Suggests "false";
APT::Clean-Installed "true";

// --- Terminal Candy ---
APT::Color "1";

// --- Unattended DPkg Safety ---
DPkg::Options {
    "--force-confdef";
    "--force-confold";
};
