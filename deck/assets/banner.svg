<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="45%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>

    <!-- Card Deck Gradients -->
    <linearGradient id="cardGradOptions" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e05a47"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="cardGradRepos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="cardGradReview" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e05a47"/>
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes fanLeft {
      0%, 100% { transform: translate(90px, 115px) rotate(-14deg); }
      50% { transform: translate(85px, 110px) rotate(-17deg); }
    }
    @keyframes fanMid {
      0%, 100% { transform: translate(115px, 110px) rotate(0deg); }
      50% { transform: translate(115px, 102px) scale(1.03); }
    }
    @keyframes fanRight {
      0%, 100% { transform: translate(140px, 115px) rotate(14deg); }
      50% { transform: translate(145px, 110px) rotate(17deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 4px #38bdf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #e05a47); }
    }
    .deck-left  { animation: fanLeft 5s ease-in-out infinite; transform-origin: 0 0; }
    .deck-mid   { animation: fanMid 5s ease-in-out infinite; transform-origin: 0 0; }
    .deck-right { animation: fanRight 5s ease-in-out infinite; transform-origin: 0 0; }
    .neon-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .deck-left, .deck-mid, .deck-right, .neon-pulse { animation: none !important; }
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#deckBg)"/>
  <rect width="900" height="240" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Cyber Grid -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.3">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="540" y1="0" x2="540" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- Left: The Control Deck Fanned Cards -->
  <!-- Card 1: Options (Left / Asahi Red) -->
  <g class="deck-left">
    <rect x="-35" y="-55" width="70" height="110" rx="8" fill="url(#cardGradOptions)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="-27" y="-45" width="54" height="6" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="-27" y="-32" width="36" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="15" cy="35" r="8" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M12 35 L14 38 L19 32" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Card 3: Review / Gate (Right / Emerald) -->
  <g class="deck-right">
    <rect x="-35" y="-55" width="70" height="110" rx="8" fill="url(#cardGradReview)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="-27" y="-45" width="54" height="6" rx="2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="-27" y="-32" width="44" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="-27" y="-22" width="28" height="4" rx="2" fill="#ffffff" fill-opacity="0.3"/>
    <path d="M-15 32 L-7 32 M-11 28 L-11 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M5 25 L18 38 M18 25 L5 38" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>

  <!-- Card 2: Repos (Center / Fedora Cyan & Shield) -->
  <g class="deck-mid">
    <rect x="-38" y="-60" width="76" height="120" rx="8" fill="url(#cardGradRepos)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" filter="url(#neonGlow)"/>
    <!-- Package Box Motif -->
    <rect x="-24" y="-40" width="48" height="34" rx="4" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M-24 -24 L24 -24" stroke="#38bdf8" stroke-width="4"/>
    <path d="M-24 -17 L24 -17" stroke="#38bdf8" stroke-width="2"/>
    <path d="M-24 -10 L24 -10" stroke="#38bdf8" stroke-width="2"/>
    <!-- Verified Shield Motif -->
    <path d="M-18 8 L18 8 C18 22 0 34 0 34 C0 34 -18 22 -18 8 Z" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <path d="M-7 18 L-2 23 L9 13" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Subtitle Branding -->
  <text x="240" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="url(#titleGrad)">repo-config-deck</text>
  <text x="242" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="0.5">Package &amp; Repository Control Deck for Fedora Asahi Remix (dnf5)</text>

  <!-- Badge Pills Row in Banner -->
  <g transform="translate(242, 142)">
    <!-- Pill 1: aarch64 M1 -->
    <rect x="0" y="0" width="92" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#f87171">aarch64 M1</text>

    <!-- Pill 2: 16k Pages -->
    <rect x="100" y="0" width="88" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="111" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#fb923c">16k-pages</text>

    <!-- Pill 3: DNF5 Native -->
    <rect x="196" y="0" width="94" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="207" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">dnf5-engine</text>

    <!-- Pill 4: Curses TUI -->
    <rect x="298" y="0" width="88" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="310" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#a78bfa">curses-tui</text>

    <!-- Pill 5: Dry-Run Gated -->
    <rect x="394" y="0" width="118" height="26" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1"/>
    <text x="404" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">✓ dryrun-gated</text>
  </g>

  <!-- Tagline Summary -->
  <text x="242" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Options Walk · Catalog Browser · Live aarch64 Check · Refusal Engine · Hardware Protection
  </text>

  <!-- Right Decorative Chip Geometry -->
  <g transform="translate(800, 110)" class="neon-pulse">
    <rect x="-42" y="-42" width="84" height="84" rx="14" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="2"/>
    <path d="M-30 -30 L-20 -30 L-20 -15 L-5 -15 L-5 -30 L5 -30 L5 -15 L20 -15 L20 -30 L30 -30" stroke="#e05a47" stroke-width="2" fill="none"/>
    <path d="M-30 30 L-20 30 L-20 15 L-5 15 L-5 30 L5 30 L5 15 L20 15 L20 30 L30 30" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="5" font-family="monospace" font-size="12" font-weight="900" fill="#34d399" text-anchor="middle">M1</text>
  </g>
</svg>
