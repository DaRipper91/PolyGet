<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Concept B: Apple Silicon chip + package crate -->
  <defs>
    <linearGradient id="b-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>
  </defs>
  <!-- Chip body -->
  <rect x="24" y="24" width="80" height="80" rx="10" ry="10" fill="#2C3E50"/>
  <!-- Chip detail lines -->
  <rect x="34" y="34" width="60" height="4" rx="2" ry="2" fill="#6095EB"/>
  <rect x="34" y="42" width="40" height="4" rx="2" ry="2" fill="#6095EB"/>
  <rect x="34" y="50" width="50" height="4" rx="2" ry="2" fill="#6095EB"/>
  <rect x="34" y="58" width="30" height="4" rx="2" ry="2" fill="#6095EB"/>
  <rect x="34" y="66" width="45" height="4" rx="2" ry="2" fill="#6095EB"/>
  <rect x="34" y="74" width="35" height="4" rx="2" ry="2" fill="#6095EB"/>
  <!-- Package crate on chip -->
  <rect x="44" y="86" width="40" height="22" rx="3" ry="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="44" y1="93" x2="84" y2="93" stroke="#2C3E50" stroke-width="3"/>
  <line x1="44" y1="100" x2="84" y2="100" stroke="#2C3E50" stroke-width="3"/>
  <line x1="44" y1="107" x2="84" y2="107" stroke="#2C3E50" stroke-width="3"/>
</svg>
