<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Concept C: Deck of cards (control deck) with package -->
  <defs>
    <linearGradient id="c-card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6095EB"/>
      <stop offset="100%" stop-color="#3C6EA5"/>
    </linearGradient>
    <linearGradient id="c-card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A7BC8"/>
      <stop offset="100%" stop-color="#2C5A8B"/>
    </linearGradient>
  </defs>
  <!-- Card deck (3 fanned cards) -->
  <rect x="24" y="28" width="60" height="72" rx="8" ry="8" fill="url(#c-card2)"/>
  <rect x="36" y="20" width="60" height="72" rx="8" ry="8" fill="url(#c-card1)"/>
  <rect x="48" y="12" width="60" height="72" rx="8" ry="8" fill="url(#c-card1)"/>
  <!-- Package on top card -->
  <rect x="58" y="38" width="26" height="18" rx="3" ry="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="58" y1="47" x2="84" y2="47" stroke="#6095EB" stroke-width="3"/>
  <line x1="58" y1="51" x2="84" y2="51" stroke="#6095EB" stroke-width="3"/>
  <line x1="58" y1="55" x2="84" y2="55" stroke="#6095EB" stroke-width="3"/>
  <!-- Checkmark on deck -->
  <path d="M42 74 L52 84 L76 62" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
