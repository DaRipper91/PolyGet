<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Device Outline: Pixel Phone Silhouette -->
  <rect x="22" y="8" width="84" height="112" rx="18" fill="url(#bodyGrad)" stroke="#475569" stroke-width="2.5"/>

  <!-- Pixel Signature Camera Visor Bar -->
  <rect x="22" y="24" width="84" height="18" rx="4" fill="url(#visorGrad)"/>
  <circle cx="48" cy="33" r="4.5" fill="#0F172A"/>
  <circle cx="64" cy="33" r="3.5" fill="#0F172A"/>
  <circle cx="80" cy="33" r="2.5" fill="#FEF08A"/>

  <!-- Tensor G5 Silicon Emblem -->
  <rect x="42" y="54" width="44" height="44" rx="8" fill="url(#chipGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="74" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="0.5">G5</text>
  <text x="64" y="87" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7.5" text-anchor="middle" letter-spacing="1">TENSOR</text>

  <!-- Verified Package Check Badge -->
  <circle cx="94" cy="98" r="14" fill="#10B981" filter="url(#glow)"/>
  <path d="M88 98 L92 102 L100 94" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
