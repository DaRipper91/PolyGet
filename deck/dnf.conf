# /etc/dnf/dnf.conf — Fedora Asahi Remix (dnf5) on the M1 MacBook Air "asahi"
# Managed by configure-dnf.sh (it rewrites values, keeps comments).
# Every option is explained in DNF-GUIDE.md. Repos live in /etc/yum.repos.d/*.repo
# (managed with `configure-dnf.sh enable/disable` or the interactive walk).
[main]

# --- Safety ----------------------------------------------------------------
# Verify package signatures (dnf5 alias of pkg_gpgcheck)
gpgcheck=True
# Kernels kept side by side (Asahi's kernel-16k is installonly). 3 = current + 2 fallbacks
installonly_limit=3
# Never remove the kernel you're running
protect_running_kernel=True
# Remove dependencies nobody needs any more on `dnf remove`
clean_requirements_on_remove=True
# Fall back to an older version instead of failing when the newest can't install
best=False
# A COPR that's down for your release (it happens around Fedora upgrades) doesn't block updates
skip_if_unavailable=True
# Packages dnf must never install/update (globs OK) — for pinning after a regression
#excludepkgs=

# --- Speed -----------------------------------------------------------------
# Parallel downloads (dnf5 default 3, max 20)
max_parallel_downloads=10
# Parallel downloads from one mirror
max_downloads_per_mirror=3
# Fedora's metalink already picks nearby mirrors; latency probing usually adds delay
fastestmirror=False
# Check repos for new metadata every 12h (default 48h); good with rolling COPRs
metadata_expire=43200
# Delta-compressed metadata downloads
zchunk=True
# Don't keep downloaded RPMs (the SSD is shared with the macOS side)
keepcache=False
# Pull in Recommends (set False for leaner installs)
install_weak_deps=True
# Seconds a stalled download may stay below minrate before aborting
timeout=30

# --- Candy -----------------------------------------------------------------
# Enter = Yes at confirmation prompts (still asks)
defaultyes=True
# Colors (dnf5 color names: black red green yellow blue magenta cyan white + bold/dim/underline/blink)
color_list_available_upgrade=bold,cyan
color_list_available_downgrade=dim,magenta
color_list_available_reinstall=bold,green
color_list_available_install=bold,blue
color_update_installed=dim,red
color_update_local=dim,green
color_update_remote=bold,magenta
color_search_match=bold,magenta
