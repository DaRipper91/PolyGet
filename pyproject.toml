[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polyget"
dynamic = ["version"]
description = "Unified package manager front-end: GUI, TUI, CLI and MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0,<6.12.0",
    "textual==8.2.7",
    "rich>=13.0.0,<15.1.0",
    "PyYAML>=6.0.0,<6.1.0",
    "keyring>=24.0",
    "packaging>=23.0",
    "mcp>=2.0.0",
]

[project.scripts]
polyget = "app.main:main"
polyget-cli = "app.cli:main"
polyget-mcp = "app.mcp_server:run_server"

[project.gui-scripts]
polyget-gui = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ui" = ["*.tcss"]
"app.core.data" = ["*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "app._version.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
